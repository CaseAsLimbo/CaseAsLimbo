name: Update internship stats

on:
  schedule:
    - cron: '0 0 * * *'   
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout stats branch
        uses: actions/checkout@v4
        with:
          ref: stats        
          token: ${{ secrets.GH_TOKEN }}  

      - name: Count commits and PRs in the organization
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          COMMITS=$(gh search commits --author="CaseAsLimbo" --owner="profcomff" --limit=1000 --json commit --jq '. | length')
          PRS=$(gh search issues --author="CaseAsLimbo" --owner="profcomff"  --include-prs --limit=1000 --json url --jq '. | length')
          echo "{\"commits\": $COMMITS, \"prs\": $PRS}" > stats.json

      - name: Push updated stats
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stats.json
          git commit -m "Update stats" || echo "No changes to commit"
          git push origin stats
